publication_mode: redistributable_under_source_terms
policy:
  duplicates:
    heldout_overlap: error
    keys: [raw, normalized]
    resolution: chain_smallest_id
    rights_conflict: error
  documents:
    empty_text: error
    exclusions: none
    markdown_kind: first_declared
    row_files: buffered
  rights:
    training_use: explicit_eligibility_required
  build:
    strategy: auto
mixture:
  technical_docs: 0.4
  code: 0.2
  configs: 0.2
  systems_scenarios: 0.2
accepted_generation_statuses: [source_entailed, oracle_verified, human_reviewed]
lm:
  selected: true
  training_splits: [train, validation]
chat:
  selected: true
  training_splits: [train, validation]
keep_nonredistributable_local: true
normalizer:
  structure_cleaning: false
  front_matter_extra_keys: {}
  gutenberg_boilerplate: []
