publication_mode: metadata_reconstruction_only
policy:
  duplicates:
    heldout_overlap: error
    keys: [raw, normalized]
    resolution: chain_smallest_id
    rights_conflict: error
  documents:
    empty_text: error
    exclusions: none
    markdown_kind: first_declared
    row_files: buffered
  rights:
    training_use: explicit_eligibility_required
  build:
    strategy: auto
  mixture:
    total_tokens: 1
    max_exposures: 1
mixture:
  general_prose: 0.81
  explanatory_prose: 0.18
  incident_response_docs: 0.01
lm:
  selected: true
  training_splits:
  - train
  - validation
chat:
  selected: false
  training_splits: []
keep_nonredistributable_local: true
record_admission:
  path: ${REVIEWED_ADMISSION_FILE}
  sha256: ${REVIEWED_ADMISSION_SHA256}
normalizer:
  structure_cleaning: true
  front_matter_extra_keys: {}
  gutenberg_boilerplate: []
