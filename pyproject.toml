[project]
name = "kybern-model-lab"
version = "0.1.0"
description = "Kybern Model Lab: a workbench for training, comparing and inspecting models"
readme = "README.md"
authors = [
    { name = "Byron Miller", email = "bymiller@redhat.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "datasets>=4,<5",
    "huggingface-hub>=0.34,<2",
    "numpy>=2,<3",
    "plotly>=6,<7",
    "psutil>=7,<8",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "streamlit>=1.64,<2",
    "tokenizers==0.22.2",
    "pyarrow>=25,<26",
    "safetensors>=0.5,<1",
]

[project.scripts]
klab = "klab.cli.entry:main"

[project.optional-dependencies]
cpu = [
    "torch==2.15.0",
]
mlx = [
    "mlx==0.32.4",
]
reference = [
    "transformers>=4.45,<5",
]
# Text extraction for `pdf_documents` corpus sources.
pdf = [
    "pypdf>=7,<8",
]
# Optional standard-task backend for `klab probe --config full`.
lmeval = [
    "lm-eval>=0.4.9,<0.5",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "klab"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" }]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-xdist>=3,<4",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
# Parallel by default; tests/conftest.py sizes `auto` from CPUs and free RAM.
# An explicit -n N (or -n 0 to debug serially) overrides it.
addopts = "-p xdist -n auto --dist worksteal"
markers = [
    "mps: requires actual Apple MPS hardware",
    "cuda: requires actual NVIDIA CUDA hardware",
    "rocm: requires actual AMD ROCm hardware",
    "xpu: requires actual Intel XPU hardware",
    "mlx: requires the optional Apple MLX runtime and Metal hardware",
    "network: requires external network access",
    "slow: excluded from the fast suite (listed in tests/slow_tests.txt; see docs/testing.md)",
]
