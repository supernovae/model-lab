schema_version: 2
name: long-context-32k-moe-sparse-latent
seed: 42
model:
  vocab_size: 512
  hidden_dim: 256
  num_layers: 4
  num_heads: 4
  ffn_dim: 704
  max_seq_len: 32768
  ffn: moe
  num_experts: 4
  experts_per_token: 2
  shared_expert: true
  router_aux_loss_coefficient: 0.01
tokenizer:
  path: ../artifacts/tokenizer_smoke/tokenizer.json
dataset:
  source: synthetic
  cache_dir: ../artifacts/data
  train_max_documents: 20000
  validation_max_documents: 2000
  train_max_tokens: 1048576
  validation_max_tokens: 131072
  synthetic_seed: 42
attention:
  kind: local_selected
  block_size: 64
  window_size: 256
  selected_blocks: 8
  latent_dim: 128
  selector: learned
training:
  seq_len: 32768
  max_steps: 8
  max_tokens: 262144
  deterministic: true
  micro_batch_size: 1
  gradient_accumulation: 1
optimizer:
  warmup_steps: 4
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  eps: 1e-8
  name: adamw
  peak: 0.003
  floor: 0.0003
  state_offload: false
evaluation:
  every_steps: 4
  max_batches: 1
logging:
  root_dir: ../runs
  every_steps: 1
runtime:
  engine: pytorch
  backend: cpu
  device_index: 0
  precision: fp32
  memory:
    policy: balanced
    max_device_memory_fraction: 0.9
    budget_bytes: null
    activation_checkpointing:
      enabled: false
      strategy: transformer_block
    activation_offload:
      enabled: false
    allowed_sequence_lengths: []
    allowed_optimizers: []
checkpoint:
  every_steps: 8
  every_tokens: null
  every_minutes: null
  keep_periodic: true
staging:
  smoke_steps: 2
  warmup_steps: 5
