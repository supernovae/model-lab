name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Draft state changes do not change code; drafts already run every PR job.
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      suite:
        description: "fast: the PR checks; release-candidate: the full CPU suite on Linux and macOS"
        type: choice
        options: [fast, release-candidate]
        default: fast

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  HF_HUB_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  CUDA_VISIBLE_DEVICES: ""
  HIP_VISIBLE_DEVICES: ""
  ROCR_VISIBLE_DEVICES: ""
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'fast'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync ruff format --check .

  test:
    # The fast suite (everything not marked slow), split by file across two
    # jobs. tests/conftest.py assigns each file to a shard by a hash of its
    # path, so no job keeps a list of files.
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'fast'
    name: test (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Fast CPU suite
        env:
          UV_OFFLINE: "1"
          KLAB_WORK_DIR: ${{ runner.temp }}/test-work
          KLAB_LAB_LOOP_BUDGET_SECONDS: "300"
          KLAB_TEST_SHARD: ${{ matrix.shard }}/2
        run: >-
          uv run --locked --no-sync pytest -q -p no:cacheprovider
          --basetemp "$RUNNER_TEMP/test-pytest"
          -n auto --maxprocesses=4 --dist worksteal --durations=15
          -m "not slow and not mps and not mlx and not cuda and not rocm and not xpu and not network"

  staging:
    # Supervised staging regressions launch real pilot children. They are
    # slow-listed, so they run here beside the fast suite on every PR.
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'fast'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Supervised staging regressions
        env:
          UV_OFFLINE: "1"
          KLAB_WORK_DIR: ${{ runner.temp }}/staging-work
        run: |
          uv run --locked --no-sync pytest -q -p no:cacheprovider \
            -n auto --maxprocesses=4 --dist worksteal --durations=10 \
            --basetemp "$RUNNER_TEMP/staging-pytest" \
            tests/test_staging.py::test_pilot_retention_is_isolated_from_full_run \
            tests/test_staging.py::test_matched_story_pilots_complete_under_native_supervision \
            tests/test_staging.py::test_warmup_pilots_are_isolated_and_bundle_is_self_contained

  release-candidate:
    # The full CPU suite, slow tests included, on manual dispatch.
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'release-candidate'
    name: Full CPU suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cpu --dev
      - name: Full CPU suite
        run: >-
          uv run --locked --no-sync pytest -q -n auto --maxprocesses=4
          --dist worksteal --durations=25
          -m "not mps and not mlx and not cuda and not rocm and not xpu and not network"
      - run: uv run --locked --no-sync klab --help
      - run: uv run --locked --no-sync klab inspect configs/micro_dense.yaml --json
